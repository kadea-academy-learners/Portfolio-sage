<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Contact Simplifié</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
            border-color: #007bff;
            outline: none;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        input[type="submit"]:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Contact Sage Dimumbe</h1>
        
        <div id="message-container"></div>
        
        <form id="form">
            <div class="field">
                <label for="name">Nom complet</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="field">
                <label for="nom">Nom de famille</label>
                <input type="text" name="nom" id="nom" required>
            </div>
            <div class="field">
                <label for="prenom">Prénom</label>
                <input type="text" name="prenom" id="prenom" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="field">
                <label for="sujet">Sujet</label>
                <input type="text" name="sujet" id="sujet" required>
            </div>
            <div class="field">
                <label for="title">Titre</label>
                <input type="text" name="title" id="title" required>
            </div>
            <div class="field">
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="5" required></textarea>
            </div>

            <input type="submit" id="button" value="Envoyer le Message">
        </form>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script type="text/javascript">
        // Initialiser EmailJS avec votre clé publique
        emailjs.init('aLWj8oMGZBR8cUZo6');

        // Configuration EmailJS
        const CONFIG = {
            SERVICE_ID: 'service_q87tgll',
            TEMPLATE_ID: 'template_t1rut2n',
            PUBLIC_KEY: 'aLWj8oMGZBR8cUZo6'
        };

        // Fonction pour afficher les messages
        function showMessage(text, type) {
            const messageContainer = document.getElementById('message-container');
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
            
            // Faire défiler vers le message
            messageContainer.scrollIntoView({ behavior: 'smooth' });
            
            // Auto-supprimer après 8 secondes pour les messages de succès/erreur
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    messageContainer.innerHTML = '';
                }, 8000);
            }
        }

        // Gestionnaire d'événement pour le formulaire
        document.getElementById('form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const button = document.getElementById('button');
            const originalText = button.value;
            
            // Afficher l'état de chargement
            button.disabled = true;
            button.value = 'Envoi en cours...';
            showMessage('🔄 Envoi de votre message en cours...', 'loading');
            
            // Récupérer les données du formulaire
            const templateParams = {
                name: document.getElementById('name').value,
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                email: document.getElementById('email').value,
                sujet: document.getElementById('sujet').value,
                title: document.getElementById('title').value,
                message: document.getElementById('message').value,
                // Ajout d'informations supplémentaires
                timestamp: new Date().toLocaleString('fr-FR'),
                from_name: document.getElementById('name').value,
                from_email: document.getElementById('email').value,
                subject: document.getElementById('sujet').value
            };

            console.log('📋 Paramètres envoyés:', templateParams);

            // Envoyer l'email via EmailJS
            emailjs.send(CONFIG.SERVICE_ID, CONFIG.TEMPLATE_ID, templateParams, CONFIG.PUBLIC_KEY)
                .then(function(response) {
                    console.log('✅ SUCCESS!', response.status, response.text);
                    
                    // Afficher le message de succès
                    showMessage(`
                        <div style="text-align: center;">
                            <div style="font-size: 24px; margin-bottom: 10px;">🎉</div>
                            <strong>Message envoyé avec succès !</strong><br>
                            <small>Votre message a été transmis à Sage Dimumbe. Vous recevrez une réponse bientôt.</small>
                        </div>
                    `, 'success');
                    
                    // Réinitialiser le formulaire
                    document.getElementById('form').reset();
                    
                }, function(error) {
                    console.log('❌ FAILED...', error);
                    
                    // Afficher le message d'erreur
                    showMessage(`
                        <div style="text-align: center;">
                            <div style="font-size: 24px; margin-bottom: 10px;">❌</div>
                            <strong>Erreur lors de l'envoi</strong><br>
                            <small>Une erreur s'est produite: ${error.text || error.message || 'Erreur inconnue'}</small><br>
                            <small>Veuillez réessayer ou contactez directement: Sagedimumbe7@gmail.com</small>
                        </div>
                    `, 'error');
                })
                .finally(function() {
                    // Restaurer le bouton
                    button.disabled = false;
                    button.value = originalText;
                });
        });

        // Validation en temps réel
        const requiredFields = ['name', 'nom', 'prenom', 'email', 'sujet', 'title', 'message'];
        
        requiredFields.forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('input', function() {
                    if (this.value.trim()) {
                        this.style.borderColor = '#28a745';
                    } else {
                        this.style.borderColor = '#ddd';
                    }
                });
            }
        });

        // Message de bienvenue
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Formulaire de contact initialisé');
            console.log('📧 Configuration EmailJS chargée');
        });
    </script>
</body>
</html>
