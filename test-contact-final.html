<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Final - Contact Sage Dimumbe</title>
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        .debug-info {
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 14px;
        }
        .debug-success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .debug-error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .debug-warning { background-color: #fff3cd; border-color: #ffeaa7; color: #856404; }
        .test-section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🧪 Test Final du Formulaire de Contact</h1>
    
    <div class="test-section">
        <h2>📋 État du Système</h2>
        <div id="system-status"></div>
    </div>

    <div class="container">
        <div class="contact-info">
            <h2>Contact</h2>
            <strong>Téléphone</strong>
            <p>+243 998715843</p>

            <strong>Email</strong>
            <p>Sagedimumbe7@gmail.com</p>
        </div>

        <hr>

        <form id="contact-form" class="form-section" onsubmit="return handleFormSubmit(event)">
            
            <div class="form-column">
                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" name="prenom" id="prenom" value="Test" required>
                </div>
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" name="nom" id="nom" value="Utilisateur" required>
                </div>
            </div>
        
            <div class="form-column">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="email" value="test@example.com" required>
                </div>
                <div class="form-group">
                    <label>Sujet</label>
                    <input type="text" name="sujet" id="sujet" value="Test depuis le site web" required>
                </div>
            </div>
        
            <div class="form-group full-width">
                <label>Message</label>
                <textarea rows="4" name="message" id="message" required>Ceci est un message de test pour vérifier que le formulaire fonctionne correctement après les corrections.</textarea>
            </div>
            
            <div class="form-group">
                <button type="submit" class="submit-btn" id="submit-btn">Envoyer</button>
                <button type="button" onclick="runDiagnostic()" style="background-color: #17a2b8; color: white; border: none; padding: 10px 20px; border-radius: 4px; margin-left: 10px;">🔍 Diagnostic</button>
            </div>
        </form>

    </div>
    
    <div class="test-section">
        <h2>🔍 Diagnostic Détaillé</h2>
        <div id="diagnostic-results"></div>
    </div>

    <script src="navbar.js"></script>
    <script src="emailjs-config.js"></script>
    <script src="contact-script.js"></script>
    
    <script>
        // Fonction de diagnostic avancé
        function runDiagnostic() {
            const diagnosticResults = document.getElementById('diagnostic-results');
            diagnosticResults.innerHTML = '<div class="debug-info">🔄 Diagnostic en cours...</div>';
            
            let results = [];
            
            // Test 1: Vérifier EmailJS
            if (typeof emailjs !== 'undefined') {
                results.push('<div class="debug-info debug-success">✅ EmailJS: Chargé correctement</div>');
            } else {
                results.push('<div class="debug-info debug-error">❌ EmailJS: Non chargé</div>');
            }
            
            // Test 2: Vérifier la configuration
            if (typeof EMAILJS_CONFIG !== 'undefined') {
                results.push(`<div class="debug-info debug-success">✅ Configuration: 
                    <br>• PUBLIC_KEY: ${EMAILJS_CONFIG.PUBLIC_KEY}
                    <br>• SERVICE_ID: ${EMAILJS_CONFIG.SERVICE_ID}
                    <br>• TEMPLATE_ID: ${EMAILJS_CONFIG.TEMPLATE_ID}</div>`);
            } else {
                results.push('<div class="debug-info debug-error">❌ Configuration EMAILJS_CONFIG non trouvée</div>');
            }
            
            // Test 3: Vérifier les fonctions
            if (typeof handleFormSubmit === 'function') {
                results.push('<div class="debug-info debug-success">✅ Fonction handleFormSubmit: Disponible</div>');
            } else {
                results.push('<div class="debug-info debug-error">❌ Fonction handleFormSubmit: Non trouvée</div>');
            }
            
            if (typeof sendMail === 'function') {
                results.push('<div class="debug-info debug-success">✅ Fonction sendMail: Disponible</div>');
            } else {
                results.push('<div class="debug-info debug-error">❌ Fonction sendMail: Non trouvée</div>');
            }
            
            // Test 4: Vérifier les champs du formulaire
            const requiredFields = ['nom', 'prenom', 'email', 'sujet', 'message'];
            let fieldsStatus = requiredFields.map(field => {
                const element = document.getElementById(field);
                if (element && element.value.trim()) {
                    return `✅ ${field}: "${element.value}"`;
                } else if (element) {
                    return `⚠️ ${field}: Vide`;
                } else {
                    return `❌ ${field}: Élément non trouvé`;
                }
            }).join('<br>• ');
            
            results.push(`<div class="debug-info debug-success">📋 Champs du formulaire:
                <br>• ${fieldsStatus}</div>`);
            
            // Test 5: Test de récupération des valeurs
            try {
                const params = {
                    nom: document.getElementById("nom").value,
                    prenom: document.getElementById("prenom").value,
                    email: document.getElementById("email").value,
                    sujet: document.getElementById("sujet").value,
                    message: document.getElementById("message").value
                };
                results.push(`<div class="debug-info debug-success">✅ Récupération des paramètres: Réussie
                    <br>Params: ${JSON.stringify(params, null, 2)}</div>`);
            } catch (error) {
                results.push(`<div class="debug-info debug-error">❌ Erreur récupération paramètres: ${error.message}</div>`);
            }
            
            diagnosticResults.innerHTML = results.join('');
        }
        
        // Vérification système au chargement
        document.addEventListener('DOMContentLoaded', function() {
            const systemStatus = document.getElementById('system-status');
            let status = [];
            
            // Vérifier le chargement des scripts
            setTimeout(() => {
                if (typeof emailjs !== 'undefined') {
                    status.push('<div class="debug-info debug-success">✅ EmailJS: Chargé</div>');
                } else {
                    status.push('<div class="debug-info debug-error">❌ EmailJS: Échec du chargement</div>');
                }
                
                if (typeof EMAILJS_CONFIG !== 'undefined') {
                    status.push('<div class="debug-info debug-success">✅ Configuration: Chargée</div>');
                } else {
                    status.push('<div class="debug-info debug-error">❌ Configuration: Non chargée</div>');
                }
                
                if (typeof handleFormSubmit === 'function') {
                    status.push('<div class="debug-info debug-success">✅ Fonction handleFormSubmit: OK</div>');
                } else {
                    status.push('<div class="debug-info debug-error">❌ Fonction handleFormSubmit: Manquante</div>');
                }
                
                systemStatus.innerHTML = status.join('');
            }, 1000);
        });
    </script>
</body>
</html>
